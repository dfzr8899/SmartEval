              scored_count: {type: integer}
              average_score: {type: number}
              score_rate: {type: number}
              review_required_count: {type: integer}
              failed_count: {type: integer}
              teacher_reviewed_count: {type: integer}
        review_stats:
          type: object
          required: [auto_scored, teacher_reviewed, review_required, failed, reviewer_revised]
          properties:
            auto_scored: {type: integer}
            teacher_reviewed: {type: integer}
            review_required: {type: integer}
            failed: {type: integer}
            reviewer_revised: {type: integer}
        similarity:
          type: object
          required: [status, high_count, medium_count]
          properties:
            status: {enum: [NOT_APPLICABLE, PENDING, COMPLETED, FAILED]}
            high_count: {type: integer}
            medium_count: {type: integer}
