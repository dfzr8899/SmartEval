          type: object
          additionalProperties:
            type: object
            required: [model, configuration_id]
            properties:
              model: {type: string}
              configuration_id: {type: string}
    Trace:
      type: object
      properties:
        roles: {type: array, items: {type: string}}
        engine_version: {type: [string, 'null']}
        review_mode: {enum: [revise, veto]}
        review_error: {type: string}
        usage:
          type: array
          items:
            type: object
            required: [agent_role, model, input_tokens, output_tokens, latency_ms]
            properties:
              agent_role: {type: string}
              model: {type: string}
              input_tokens: {type: [integer, 'null']}
              output_tokens: {type: [integer, 'null']}
              latency_ms: {type: integer}
    Result:
      type: [object, 'null']
      properties:
        suggested_score: {type: [integer, 'null']}
        final_score: {type: [integer, 'null']}
        declared_total_score: {type: [integer, 'null']}
        approved: {type: boolean}
        reviewer_revised: {type: boolean}
        review_summary: {type: string}
        reason: {type: string}
        review_reason: {type: string}
        decision: {enum: [RULE, AGENTS, JUDGE, TEACHER]}
        risk_signals:
          type: array
          items: {type: string}
        trace: {$ref: '#/components/schemas/Trace'}
        analysis_error: {type: string}
        findings:
          type: array
          items:
            type: object
            properties:
              quote: {type: string}
              reason: {type: string}
              line: {type: integer}
        initial_criteria:
          type: array
          description: 当复核 Agent 修订了初评结果时保留的初评细则快照。
          items:
            type: object
            properties:
              id: {type: string}
              points: {type: integer}
              reason: {type: string}
              quote: {type: string}
        criteria:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              points: {type: integer}
              max_points: {type: integer}
              description: {type: string, description: 报告中对应的已确认评分细则。}
              reason: {type: string}
              detail: {type: string, description: 编程题非 AC 时的编译输出、标准错误或实际输出摘要。}
              quote: {type: string}
              start: {type: integer, description: 原答中的 UTF-16 起始索引。}
              end: {type: integer, description: 原答中的 UTF-16 结束索引。}
              wall_time_ms: {type: integer}
              source_ids: {type: array, items: {type: string}}
    Template:
      type: object
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        title: {type: string}
        questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
    WebhookDelivery:
      type: object
      required: [id, run, job_revision, event, status, attempts, created_at]
      properties:
        id: {type: string, format: uuid}
        run: {type: integer}
        job_revision: {type: integer}
        event: {$ref: '#/components/schemas/JobEventType'}
