        delivered_at: {type: [string, 'null'], format: date-time}
        next_attempt_at: {type: [string, 'null'], format: date-time}
    AnalyticsOverview:
      type: object
      required: [total_jobs, active_jobs, awaiting_confirmation_jobs, review_required_jobs, completed_jobs, total_items, scored_items, review_required_items, failed_items, human_reviewed_items, similarity_high_alerts, similarity_medium_alerts, recent_jobs]
