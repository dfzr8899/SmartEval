        active_jobs: {type: integer}
        awaiting_confirmation_jobs: {type: integer}
        review_required_jobs: {type: integer}
        completed_jobs: {type: integer}
        total_items: {type: integer}
        scored_items: {type: integer}
        review_required_items: {type: integer}
        failed_items: {type: integer}
        human_reviewed_items: {type: integer}
        similarity_high_alerts: {type: integer}
        similarity_medium_alerts: {type: integer}
        recent_jobs:
          type: array
          items:
            type: object
            required: [id, title, status, created_at, submission_count, mean_rate, pass_rate, review_required_count, similarity_alerts]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              status: {type: string}
              created_at: {type: string, format: date-time}
              submission_count: {type: integer}
              mean_rate: {type: number}
              pass_rate: {type: number}
              review_required_count: {type: integer}
              similarity_alerts: {type: integer}
    JobAnalytics:
      type: object
      required: [job_id, title, run, latest_run, submission_count, final_submission_count, max_total_score, summary, distribution, questions, review_stats, similarity]
      properties:
        job_id: {type: string, format: uuid}
        title: {type: string}
        run: {type: integer}
        latest_run: {type: integer}
        submission_count: {type: integer}
        final_submission_count: {type: integer}
        max_total_score: {type: integer}
        summary:
          type: object
          required: [mean_score, median_score, max_score, min_score, std_dev, mean_rate, pass_rate, excellent_rate]
          properties:
            mean_score: {type: number}
            median_score: {type: number}
            max_score: {type: number}
            min_score: {type: number}
            std_dev: {type: number}
            mean_rate: {type: number}
            pass_rate: {type: number}
            excellent_rate: {type: number}
        distribution:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: {type: string}
              count: {type: integer}
        questions:
          type: array
