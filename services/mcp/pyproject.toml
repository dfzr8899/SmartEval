[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarteval-mcp"
version = "0.1.0"
description = "SmartEval public v2 API tools for MCP clients"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1", "starlette>=0.49,<2"]

[project.scripts]
smarteval-mcp = "smarteval_mcp.server:main"
smarteval-mcp-http = "smarteval_mcp.http:main"

[tool.setuptools.packages.find]
include = ["smarteval_mcp*"]
